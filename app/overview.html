<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="wr-build" content="5.5">
<title>Client Overview Studio</title>
<link rel="icon" type="image/png" href="assets/logo.png">
<style>
  html { color-scheme: light; }
  body { margin: 0; font: 14px/1.45 system-ui, "Segoe UI", sans-serif; padding-inline: 16px; padding-block: 14px 40px; }
</style>
<link rel="stylesheet" href="css/app.css?v=20261121a">
<link rel="stylesheet" href="css/overview.css?v=20261124m">
<link rel="stylesheet" href="css/folders.css?v=20261118c">
<link rel="stylesheet" href="css/present.css?v=20261124m">
<link rel="stylesheet" href="css/view.css?v=20261124d">
</head>
<body>
<div class="top">
  <div class="titlebar">
    <div class="tleft">
      <img class="brand" src="assets/logo.png" alt="Wealth Revolution, insurance and investment brokers" width="127" height="68">
      <div class="ttl"><h1>Client Overview Studio</h1><small id="verLine"></small></div>
    </div>
    <div class="tmid">
      <span class="who">Client <b id="clientName">New client</b></span>
      <span class="savestate" id="saveState"></span>
    </div>
    <span class="chips">
      <details class="otherforms" id="otherForms">
        <summary class="btn ghost small" title="The other pages of this site: each opens in another tab">Other forms &#9662;</summary>
        <div class="ofmenu">
          <a class="btn ghost small" id="linkFF" href="index.html" target="_blank" rel="noopener" title="Open the Fact Find in another tab">Fact Find &#8599;</a>
          <a class="btn ghost small" id="linkSR" href="short-risk.html" data-base="short-risk.html" target="_blank" rel="noopener" title="Open the Risk Application in another tab, filled from the Fact Find when this client&#39;s Fact Find is open">Risk Application &#8599;</a>
          <a class="btn ghost small" id="linkCS" href="capture-sheet.html" data-base="capture-sheet.html" target="_blank" rel="noopener" title="Open the Investment Application in another tab, filled from the Fact Find when this client&#39;s Fact Find is open">Investment Application &#8599;</a>
        </div>
      </details>
    </span>
  </div>
  <div class="actions">
    <div class="grp left">
      <button class="btn ghost small" id="btnNew" type="button">New</button>
      <button class="btn ghost small" id="btnOpen" type="button">Open&hellip;</button>
      <button class="btn small" id="btnSave" type="button">Save</button>
      <button class="btn small" id="btnReadFolder" type="button" title="Open the client&#39;s folder, list what it holds, and read and sort what you tick (the quotes first, then their change moment pay-out guides). If the folder is not found, the normal file window opens.">Load from client folder&hellip;</button>
      <details class="otherforms" id="moreMenu">
        <summary class="btn ghost small" title="Fill from Fact Find, Check all blocks, Folders, New review year, Save as, Settings">More &#9662;</summary>
        <div class="ofmenu">
          <button class="btn ghost small" id="btnLoad" type="button" title="Fill the overview from the client&#39;s saved Fact Find file">Fill from Fact Find&hellip;</button>
          <button class="btn ghost small" id="btnCheck" type="button" title="Every block looks again at what it holds and says what it found: a red dot means checked, nothing there">Check all blocks</button>
          <button class="btn ghost small" id="btnFolders" type="button" title="Connect your New Business and Client Files folders, so Save goes straight into the client&#39;s 1. Overview folder">Folders&hellip;</button>
          <button class="btn ghost small" id="btnReview" type="button" title="Start next year's review from this overview: the client, policies, group benefits, investments and other cover carry over to be checked; the quotes start empty. This overview is not changed, so save it first.">New review year&hellip;</button>
          <button class="btn ghost small" id="btnSaveAs" type="button">Save as&hellip;</button>
          <button class="btn ghost small" id="btnSettings" type="button" title="Your Anthropic key (the same one the Fact Find uses) and whether documents are read">Settings&hellip;</button>
        </div>
      </details>
    </div>
    <div class="grp mid"></div>
    <div class="grp right">
      <button class="btn ghost small" id="btnPreview" type="button">Preview PDF</button>
      <button class="btn small" id="btnPdf" type="button">Save PDF</button>
      <button class="btn small" id="btnPresent" type="button" title="Show this overview to the client in the meeting: read-only, moved by clicking">Present</button>
      <button class="btn small" id="btnPresentFull" type="button" title="Show the overview to the client and fill the whole screen: no Chrome tabs, address bar or bookmarks (Esc leaves full screen)">Present full screen</button>
    </div>
  </div>
  <input type="file" id="fileIn" accept=".json,application/json" hidden>
  <input type="file" id="ffIn" accept=".json,application/json" hidden>
  <input type="file" id="docIn" accept=".pdf,.png,.jpg,.jpeg,application/pdf,image/*" multiple hidden>
  <input type="file" id="docOne" accept=".pdf,.png,.jpg,.jpeg,application/pdf,image/*" hidden>
</div>

<div class="app">
  <nav class="nav" id="nav" aria-label="Blocks"></nav>
  <main class="main ov" id="main"></main>
  <aside class="side">
    <div class="card"><h3>Progress</h3>
      <div class="summary">
        <div><b id="sFilled">0</b><span>checked</span></div>
        <div class="sbtn" id="sVerifyBox" role="button" tabindex="0" title="Go to the next row to check"><b id="sVerify">0</b><span>to check</span></div>
        <div class="sbtn" id="sEmptyBox" role="button" tabindex="0" title="Go to the next row waiting for a document"><b id="sEmpty">0</b><span>waiting</span></div>
      </div>
      <button class="btn ghost small" id="btnAgree" type="button" hidden>Mark everything as checked</button>
    </div>
    <div class="card"><h3>Checks</h3><div class="checks" id="checks"></div></div>
    <div class="card"><h3>This overview</h3><div class="meta" id="meta"></div></div>
  </aside>
</div>
<div class="toast" id="toast" hidden></div>
